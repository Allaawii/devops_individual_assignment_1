# One pipeline for the whole repository (ADR-9).
# CI, on every push and pull request: lint and test each service against a real SQL Server,
# with a 70% coverage gate; validate system.yaml and both OpenAPI documents; build every image
# and run the cross-seam tests against the compose stack, including content being stopped.
# CD, on a push to main only and only after every CI job passed on that same commit: push both
# images to GHCR tagged with the commit SHA, deploy them to Azure Container Apps, upload the UI
# to the storage account's static website with the services' URLs in config.js, then poll /health.
#
# No secret is stored here. CI never touches Azure SQL: every database password used in CI
# is generated inside the run, masked in the logs, and thrown away with the run. CD signs in to
# Azure as a managed identity through GitHub's OIDC token (no Azure password exists anywhere),
# and reads the two database passwords from GitHub Actions secrets; the connection strings
# built from them reach Container Apps as Container Apps secrets, never as plain variables.

name: pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/allaawii     # GHCR wants a lower-case owner

# A newer push to the same branch cancels the older run, except on main, where a deploy
# must never be cut off halfway.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # a failure in one service still shows the other's results
      matrix:
        service: [content, scheduler]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install the service and its test tools
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Start a throwaway SQL Server with a password made for this run
        run: |
          password="Ci_$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server, then create the test database
        run: |
          for attempt in $(seq 1 60); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b \
                 -Q "IF DB_ID('frase_test') IS NULL CREATE DATABASE frase_test" > /dev/null 2>&1; then
              echo "SQL Server is ready (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          docker logs sqlserver
          exit 1

      - name: Test with coverage (fails below 70%; SQL Server tests may not be skipped)
        env:
          TEST_DATABASE_URL: mssql://sa:${{ env.SA_PASSWORD }}@localhost:1433/frase_test
          REQUIRE_SQL_TESTS: "1"
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  validate:
    name: validate system.yaml and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install the validators
        run: pip install check-jsonschema==0.38.2 openapi-spec-validator==0.9.0

      - name: Each openapi.yaml against the OpenAPI specification
        run: openapi-spec-validator services/content/openapi.yaml services/scheduler/openapi.yaml

      - name: system.yaml against system.schema.json
        run: |
          if [ ! -f system.schema.json ]; then
            echo "::error file=system.yaml::system.schema.json (provided with the brief) is not in the repository root"
            exit 1
          fi
          check-jsonschema --schemafile system.schema.json system.yaml

  integration:
    name: integration (compose stack)
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Make throwaway database passwords for this run (compose reads them from the environment)
        run: |
          for name in MSSQL_SA_PASSWORD CONTENT_DB_PASSWORD SCHEDULER_DB_PASSWORD; do
            value="Ci_$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Build every image (a failed build fails the pipeline)
        run: docker compose build

      - name: Start the whole stack
        run: docker compose up -d

      - name: Wait until both services report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8001/health && curl -fsS http://localhost:8002/health; then
              echo
              echo "both healthy (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install the integration test tools
        run: pip install pytest==9.1.1 requests==2.34.2

      - name: Cross-seam tests, both services up
        working-directory: tests/integration
        run: pytest -m "not content_down"

      - name: Migrations ran once, and a restart applies nothing
        run: |
          docker compose logs content | grep "migration applied: 001_init"
          docker compose logs scheduler | grep "migration applied: 001_init"
          docker compose restart content
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8001/health > /dev/null && break
            sleep 2
          done
          docker compose logs content | grep "migrations: nothing to apply"
          docker compose logs content | grep -c "seed: imported 3000 sentences" | grep -x 1

      - name: Stop content
        run: docker compose stop content

      - name: Partial-failure tests, content stopped
        working-directory: tests/integration
        run: pytest -m content_down

      - name: Show the service logs (method, path, status, duration per request)
        if: always()
        run: docker compose logs content scheduler | tail -n 80

      - name: Remove the stack and its volume
        if: always()
        run: docker compose down -v

  # ----- CD: push to main only, after all three CI jobs passed on this commit -----
  # PREFIX, RESOURCE_GROUP and UI_STORAGE are GitHub Actions variables set by infra/setup.sh.

  images:
    name: push image (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, validate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # lets GITHUB_TOKEN push to this account's GHCR
    strategy:
      matrix:
        service: [content, scheduler]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to GHCR with the run's own token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push, tagged with the commit SHA (and latest)
        # --provenance=false: a provenance attestation turns the image into a list that
        # Container Apps cannot pull.
        run: |
          image="$REGISTRY/frase-${{ matrix.service }}"
          docker build services/${{ matrix.service }} --provenance=false \
            --build-arg GIT_SHA=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag "$image:${{ github.sha }}" --tag "$image:latest"
          docker push --all-tags "$image"

  deploy:
    name: deploy to Azure Container Apps
    needs: images
    runs-on: ubuntu-latest
    permissions:
      id-token: write             # lets azure/login exchange GitHub's OIDC token for Azure access
      contents: read
    env:
      PREFIX: ${{ vars.PREFIX }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
    outputs:
      content_url: ${{ steps.urls.outputs.content_url }}
      scheduler_url: ${{ steps.urls.outputs.scheduler_url }}
    steps:
      - name: Sign in to Azure as the pipeline's managed identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Look up the public addresses
        id: urls
        run: |
          fqdn() { az containerapp show --name "$PREFIX-$1" --resource-group "$RESOURCE_GROUP" \
                     --query properties.configuration.ingress.fqdn --output tsv; }
          ui_url=$(az storage account show --name "${{ vars.UI_STORAGE }}" --resource-group "$RESOURCE_GROUP" \
                     --query primaryEndpoints.web --output tsv)
          echo "content_url=https://$(fqdn content)" >> "$GITHUB_OUTPUT"
          echo "scheduler_url=https://$(fqdn scheduler)" >> "$GITHUB_OUTPUT"
          echo "ui_origin=${ui_url%/}" >> "$GITHUB_OUTPUT"      # the CORS origin has no trailing slash

      - name: Deploy content (connection string as a Container Apps secret)
        env:
          DB_PASSWORD: ${{ secrets.CONTENT_DB_PASSWORD }}
        run: |
          app="$PREFIX-content"
          url="mssql://content_svc:$DB_PASSWORD@$PREFIX-sql.database.windows.net:1433/$PREFIX-content-db"
          az containerapp secret set --name "$app" --resource-group "$RESOURCE_GROUP" \
            --secrets database-url="$url" --output none
          az containerapp update --name "$app" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/frase-content:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars DATABASE_URL=secretref:database-url GIT_SHA=${{ github.sha }} \
                           CORS_ORIGIN=${{ steps.urls.outputs.ui_origin }} \
            --output none

      - name: Deploy scheduler (finds content through CONTENT_URL)
        env:
          DB_PASSWORD: ${{ secrets.SCHEDULER_DB_PASSWORD }}
        run: |
          app="$PREFIX-scheduler"
          url="mssql://scheduler_svc:$DB_PASSWORD@$PREFIX-sql.database.windows.net:1433/$PREFIX-scheduler-db"
          az containerapp secret set --name "$app" --resource-group "$RESOURCE_GROUP" \
            --secrets database-url="$url" --output none
          az containerapp update --name "$app" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/frase-scheduler:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 1 \
            --set-env-vars DATABASE_URL=secretref:database-url GIT_SHA=${{ github.sha }} \
                           CORS_ORIGIN=${{ steps.urls.outputs.ui_origin }} \
                           CONTENT_URL=${{ steps.urls.outputs.content_url }} \
            --output none

  ui:
    name: publish the UI (storage static website)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Write config.js with the deployed services' URLs
        run: |
          cat > ui/config.js <<EOF
          // Written by the deploy job for commit ${{ github.sha }}.
          window.FRASE_CONFIG = {
            contentUrl: "${{ needs.deploy.outputs.content_url }}",
            schedulerUrl: "${{ needs.deploy.outputs.scheduler_url }}",
          };
          EOF
          cat ui/config.js

      - name: Sign in to Azure as the pipeline's managed identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload ui/ to the $web container (plain static files, nothing to build)
        run: |
          az storage blob upload-batch --account-name "${{ vars.UI_STORAGE }}" --auth-mode key \
            --destination '$web' --source ui --overwrite --output none
          echo "published to $(az storage account show --name "${{ vars.UI_STORAGE }}" \
            --query primaryEndpoints.web --output tsv)"

  smoke:
    name: health check after deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Both services answer /health with 200 within 4 minutes
        run: |
          # A cold start plus a paused database resuming can take over a minute, so poll.
          for attempt in $(seq 1 24); do
            content=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ needs.deploy.outputs.content_url }}/health" || true)
            scheduler=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ needs.deploy.outputs.scheduler_url }}/health" || true)
            echo "attempt $attempt: content $content, scheduler $scheduler"
            if [ "$content" = 200 ] && [ "$scheduler" = 200 ]; then
              curl -s "${{ needs.deploy.outputs.content_url }}/health"; echo
              curl -s "${{ needs.deploy.outputs.scheduler_url }}/health"; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::a service did not report healthy within 4 minutes"
          exit 1
