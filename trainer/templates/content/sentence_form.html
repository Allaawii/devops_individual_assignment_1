{% extends "base.html" %}
{% block title %}Add sentence · Spanish trainer{% endblock %}
{% block content %}
<h1>Add a sentence</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="stack">
  <label>Spanish
    <input name="spanish" lang="es" value="{{ form.spanish }}" placeholder="Ojalá llueva mañana." required>
  </label>
  <label>English
    <input name="english" value="{{ form.english }}" placeholder="I hope it rains tomorrow." required>
  </label>
  <label>Grammar note <span class="hint">Optional. Left blank, it's filled in when a grammar rule matches.</span>
    <input name="grammar_note" value="{{ form.grammar_note }}">
  </label>
  <button type="submit">Save sentence</button>
</form>
{% endblock %}
