{% macro pager(endpoint, page) %}
<nav class="pager">
  {% if page.number > 1 %}<a href="{{ url_for(endpoint, page=page.number - 1) }}">&larr; Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }}</span>
  {% if page.has_next %}<a href="{{ url_for(endpoint, page=page.number + 1) }}">Next &rarr;</a>{% endif %}
</nav>
{% endmacro %}
