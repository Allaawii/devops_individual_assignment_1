{% macro pager(endpoint, page, has_next) %}
<nav class="pager">
  {% if page > 1 %}<a href="{{ url_for(endpoint, page=page - 1) }}">&larr; Previous</a>{% endif %}
  <span class="muted">Page {{ page }}</span>
  {% if has_next %}<a href="{{ url_for(endpoint, page=page + 1) }}">Next &rarr;</a>{% endif %}
</nav>
{% endmacro %}
