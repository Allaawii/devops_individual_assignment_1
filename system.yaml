# yaml-language-server: $schema=./system.schema.json
student: aalsamar.ieu2024
prefix: aalsamar-ieu2024
# The Static Web App's address; Azure assigns the host name when the app is created (setup step 6).
public_url: https://aalsamar-ieu2024-ui.azurestaticapps.net
ui:
  path: ui
  static_web_app: aalsamar-ieu2024-ui
  calls: [content, scheduler]
azure:
  resource_group: rg-sdd-3b
  container_apps_environment: aalsamar-ieu2024-env
  sql_server: aalsamar-ieu2024-sql
  registry: ghcr.io/allaawii
services:
  content:
    description: >-
      Sentences, words and their links, grammar notes, the placement quiz and its scoring, and the
      feed of new sentences that the scheduler pulls. Seeds 3,000 Tatoeba sentences on first start.
    path: services/content
    openapi: services/content/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/content/migrations
    env:
      PORT: { default: 8000, description: "Port the service listens on" }
      DATABASE_URL: { secret: true, description: "Connection string of the content database (mssql://user:password@host:1433/database)" }
      CORS_ORIGIN: { default: "http://localhost:8080", description: "The only browser origin allowed to call the API (the UI)" }
      GIT_SHA: { default: dev, description: "Commit the image was built from, reported by /health" }
      DB_RETRY_SECONDS: { default: 90, description: "How long startup keeps retrying the database connection (Azure SQL resuming from pause)" }
    calls: []
    azure:
      container_app: aalsamar-ieu2024-content
      sql_database: aalsamar-ieu2024-content-db
  scheduler:
    description: >-
      Cards, reviews, the daily goal and the placement level, scheduled with SM-2 or Leitner. Pulls
      new sentences from content and fetches each card's text from it.
    path: services/scheduler
    openapi: services/scheduler/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/scheduler/migrations
    env:
      PORT: { default: 8000, description: "Port the service listens on" }
      DATABASE_URL: { secret: true, description: "Connection string of the scheduler database (mssql://user:password@host:1433/database)" }
      CORS_ORIGIN: { default: "http://localhost:8080", description: "The only browser origin allowed to call the API (the UI)" }
      GIT_SHA: { default: dev, description: "Commit the image was built from, reported by /health" }
      DB_RETRY_SECONDS: { default: 90, description: "How long startup keeps retrying the database connection (Azure SQL resuming from pause)" }
      CONTENT_URL: { default: "http://content:8000", description: "Base URL of the content service" }
      CONTENT_TIMEOUT_S: { default: 2, description: "Timeout in seconds for one call to content (scoring the quiz allows at least 5)" }
      SCHEDULER: { default: sm2, description: "Scheduling algorithm, sm2 or leitner" }
      NEW_CARDS_PER_DAY: { default: 15, description: "Daily goal used until the learner chooses one" }
    calls:
      - service: content
        url_env: CONTENT_URL
        endpoints: ["GET /sentences/feed", "GET /sentences/{sentence_id}", "GET /words/{word_id}", "POST /placement/score"]
        timeout_s: 2
        on_failure: >-
          The review page and quiz scoring answer 503 content_unavailable ("your progress is safe, try
          again"); the dashboard numbers, the daily goal, rating a card and skipping the quiz keep working.
          Each call is tried once.
    azure:
      container_app: aalsamar-ieu2024-scheduler
      sql_database: aalsamar-ieu2024-scheduler-db
